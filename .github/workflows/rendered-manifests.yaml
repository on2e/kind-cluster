name: Rendered Manifests

on:
  push:
    branches:
      - main
    paths:
      - "deployments/**"
      - "!deployments/**/install.yaml"

jobs:
  changes:
    outputs:
      ingress-nginx: ${{ steps.filter.outputs.ingress-nginx }}
      postgresql: ${{ steps.filter.outputs.postgresql }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            ingress-nginx:
              - 'deployments/ingress-nginx/base/**'
            postgresql:
              - 'deployments/postgresql/base/**'

  ingress-nginx:
    needs: changes
    if: needs.changes.outputs.ingress-nginx == 'true'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/reuse-rendered-manifests.yaml
    with:
      name: ingress-nginx

  postgresql:
    needs: changes
    if: needs.changes.outputs.postgresql == 'true'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/reuse-rendered-manifests.yaml
    with:
      name: postgresql
